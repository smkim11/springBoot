spring.application.name=mybatis-test

server.port=80

# view파일 호출 시 파일 이름만 호출해도 되게 설정
spring.mvc.view.prefix=/WEB-INF/view/
spring.mvc.view.suffix=.jsp

# DB config
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/mybatis
spring.datasource.username=root
spring.datasource.password=java1234

#log config
logging.level.com.example.mybatistest.controller=debug
logging.level.com.example.mybatistest.service=debug
logging.level.com.example.mybatistest.mapper=debug